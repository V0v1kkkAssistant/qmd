version: "3.9"

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: qmd-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - QMD_GATEWAY_API_KEY=${QMD_GATEWAY_API_KEY:-change-me}
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    command: >
      /bin/sh -lc "envsubst '$$QMD_GATEWAY_API_KEY' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      - api-embed
      - api-generate
      - api-rerank

  # OpenAI-compatible embeddings endpoint: POST /v1/embeddings
  api-embed:
    image: vllm/vllm-openai:latest
    container_name: qmd-api-embed
    restart: unless-stopped
    command: >
      --host 0.0.0.0
      --port 8000
      --model ${QMD_EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      --task embed
      --dtype half
      --gpu-memory-utilization ${QMD_EMBED_GPU_UTIL:-0.25}
      --max-model-len 2048
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  # OpenAI-compatible generation endpoint: POST /v1/chat/completions
  api-generate:
    image: vllm/vllm-openai:latest
    container_name: qmd-api-generate
    restart: unless-stopped
    command: >
      --host 0.0.0.0
      --port 8000
      --model ${QMD_GENERATE_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      --dtype half
      --gpu-memory-utilization ${QMD_GENERATE_GPU_UTIL:-0.45}
      --max-model-len 4096
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  # Rerank service (provider-specific endpoint): POST /rerank
  api-rerank:
    image: michaelf34/infinity:latest
    container_name: qmd-api-rerank
    restart: unless-stopped
    command: >
      v2
      --host 0.0.0.0
      --port 7997
      --model-id ${QMD_RERANK_MODEL:-BAAI/bge-reranker-base}
      --batch-size 16
      --engine torch
      --device cuda
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
